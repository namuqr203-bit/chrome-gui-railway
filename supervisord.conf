[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 %(ENV_RESOLUTION)s -nolisten tcp
autorestart=true
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:fluxbox]
command=/usr/bin/fluxbox
environment=DISPLAY=":1"
autorestart=true
priority=2
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:chrome]
command=/usr/bin/google-chrome-stable
    --no-sandbox
    --disable-dev-shm-usage
    --disable-gpu
    --start-maximized
    --window-position=0,0
    --user-data-dir=/data/chrome-profile
    --no-first-run
    --no-default-browser-check
    --disable-session-crashed-bubble
    --disable-infobars
environment=DISPLAY=":1"
autorestart=true
priority=3
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:x11vnc]
; VNC_PASSWORD, if set, is turned into a password file by start.sh before
; supervisord's programs start; -rfbauth points at it, otherwise -nopw.
command=/bin/bash -c "if [ -f /data/vncpasswd ]; then x11vnc -display :1 -forever -shared -rfbauth /data/vncpasswd -rfbport 5900; else x11vnc -display :1 -forever -shared -nopw -rfbport 5900; fi"
autorestart=true
priority=4
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:novnc]
; Railway only routes one public HTTP port, given via $PORT. websockify serves
; the noVNC web client AND proxies the WebSocket->VNC traffic on that same port.
command=/bin/bash -c "websockify --web=/usr/share/novnc/ %(ENV_PORT)s localhost:5900"
autorestart=true
priority=5
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
